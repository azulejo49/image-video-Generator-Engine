<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Bizarre Imaginarium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1f2937 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 900px;
            width: 95%;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        /* Custom spinner for loading state */
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #f97316;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container bg-gray-800 rounded-xl space-y-8">
        <header class="text-center text-white">
            <h1 class="text-4xl font-bold text-orange-400 mb-2">The Bizarre Imaginarium</h1>
            <p class="text-xl text-gray-400">Turn your freakiest, most surreal ideas into unique art.</p>
        </header>

        <!-- Input Section -->
        <div class="flex flex-col md:flex-row space-y-4 md:space-y-0 md:space-x-4">
            <input type="text" id="promptInput" placeholder="A cosmic jellyfish wearing a monocle..."
                   class="flex-grow p-3 rounded-lg bg-gray-700 border-2 border-gray-600 focus:border-orange-500 text-white placeholder-gray-400 shadow-inner"
                   onkeydown="if(event.key === 'Enter') generateImage()">
            <button id="generateButton" onclick="generateImage()"
                    class="px-6 py-3 bg-orange-600 hover:bg-orange-700 text-white font-semibold rounded-lg shadow-lg transition duration-200 disabled:bg-gray-500 disabled:cursor-not-allowed">
                Generate Bizarre Image
            </button>
        </div>

        <!-- Output Section -->
        <div id="outputArea" class="min-h-[300px] bg-gray-700 rounded-lg flex items-center justify-center p-4 border border-gray-600">
            <div id="initialMessage" class="text-gray-400 text-center">
                Enter a surreal prompt above and click 'Generate' to see the image appear here.
            </div>
            <div id="loadingIndicator" class="hidden flex flex-col items-center">
                <div class="spinner mb-3"></div>
                <p class="text-orange-400">Conjuring the unusual...</p>
            </div>
            <img id="generatedImage" src="" alt="Generated surreal image" class="hidden max-w-full h-auto rounded-lg shadow-xl" onerror="this.classList.add('hidden')">
            <div id="errorMessage" class="hidden text-red-400 text-center p-4 bg-red-900/30 rounded-lg"></div>
        </div>
    </div>

    <script>
        const promptInput = document.getElementById('promptInput');
        const generateButton = document.getElementById('generateButton');
        const initialMessage = document.getElementById('initialMessage');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const generatedImage = document.getElementById('generatedImage');
        const errorMessage = document.getElementById('errorMessage');

        const API_MODEL = "imagen-4.0-generate-001";
        const apiKey = ""; // Canvas will automatically provide the API key
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${API_MODEL}:predict?key=${apiKey}`;

        // Utility function for exponential backoff
        const withExponentialBackoff = async (fn, maxRetries = 5, delay = 1000) => {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    return await fn();
                } catch (error) {
                    if (i === maxRetries - 1) throw error;
                    await new Promise(resolve => setTimeout(resolve, delay * Math.pow(2, i)));
                }
            }
        };

        const generateImage = async () => {
            const userPrompt = promptInput.value.trim();

            if (!userPrompt) {
                displayError("Please enter a bizarre prompt to start the generation!");
                return;
            }

            // 1. UI State: Start Loading
            generateButton.disabled = true;
            initialMessage.classList.add('hidden');
            generatedImage.classList.add('hidden');
            errorMessage.classList.add('hidden');
            loadingIndicator.classList.remove('hidden');

            try {
                const payload = {
                    instances: {
                        prompt: userPrompt
                    },
                    parameters: {
                        "sampleCount": 1
                    }
                };

                const fetchFn = async () => {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(`API Error: ${response.status} - ${errorData.error?.message || 'Unknown error'}`);
                    }

                    return response;
                };

                const response = await withExponentialBackoff(fetchFn);
                const result = await response.json();

                // 2. Process Result
                const base64Data = result?.predictions?.[0]?.bytesBase64Encoded;

                if (!base64Data) {
                    throw new Error("Received an invalid response from the image generator.");
                }

                // Display the image
                const imageUrl = `data:image/png;base64,${base64Data}`;
                generatedImage.src = imageUrl;
                generatedImage.classList.remove('hidden');

            } catch (error) {
                console.error("Image generation failed:", error);
                displayError(`Failed to generate image. Please try a different prompt or check the console for details. (Error: ${error.message})`);
            } finally {
                // 3. UI State: Stop Loading
                loadingIndicator.classList.add('hidden');
                generateButton.disabled = false;
            }
        };

        const displayError = (message) => {
            errorMessage.textContent = message;
            errorMessage.classList.remove('hidden');
            initialMessage.classList.add('hidden');
            generatedImage.classList.add('hidden');
        };

    </script>

</body>
</html>
